name: Build and Deploy

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            set -e
            APP_DIR=/root/new-api
            HEALTH_URL=http://localhost:3000/api/status

            cd $APP_DIR
            echo "===== 拉取最新代码 ====="
            git fetch origin deploy
            git reset --hard origin/deploy
            git clean -fdx -e data -e .env 2>/dev/null || true

            echo "===== 备份数据 ====="
            mkdir -p /root/backup
            if [ -d data ] && [ "$(ls -A data 2>/dev/null)" ]; then
              tar -czf /root/backup/data-$(date +%Y%m%d-%H%M%S).tar.gz data
              find /root/backup -name "data-*.tar.gz" -mtime +14 -delete
            fi

            echo "===== 拉取新镜像 ====="
            docker compose pull new-api

            echo "===== 重启服务 ====="
            docker compose down --remove-orphans new-api
            docker compose up -d new-api

            echo "===== 清理旧镜像 ====="
            docker image prune -f

            echo "===== 健康检查 ====="
            sleep 8
            for i in 1 2 3 4 5; do
              if curl -fsS $HEALTH_URL; then
                echo ""
                echo "部署完成：$(date)"
                exit 0
              fi
              echo "等待服务启动... ($i/5)"
              sleep 5
            done

            echo "健康检查失败，查看最近日志："
            docker compose logs --tail=100 new-api
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "部署失败，请检查 GitHub Actions 日志"
          echo "服务器排查命令：ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd /root/new-api && docker compose logs --tail=200'"
