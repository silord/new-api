name: Deploy new-api to server

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script: |
            set -e
            APP_DIR=/root/new-api
            BACKUP_DIR=/root/backup
            HEALTH_URL=http://localhost:3000/api/status

            # 首次部署：克隆仓库
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "===== 首次部署：克隆仓库 ====="
              git clone https://github.com/silord/new-api.git $APP_DIR
              cd $APP_DIR
              git checkout deploy
            else
              echo "===== 进入项目目录 ====="
              cd $APP_DIR
            fi

            # 同步最新代码
            echo "===== 拉取最新代码 ====="
            git fetch origin deploy
            git reset --hard origin/deploy
            git clean -fdx -e data -e .env 2>/dev/null || true

            # 准备数据目录
            mkdir -p data

            # 备份数据
            echo "===== 备份数据 ====="
            mkdir -p $BACKUP_DIR
            if [ -d data ] && [ "$(ls -A data 2>/dev/null)" ]; then
              tar -czf $BACKUP_DIR/data-$(date +%Y%m%d-%H%M%S).tar.gz data
              # 只保留最近 14 天备份
              find $BACKUP_DIR -name "data-*.tar.gz" -mtime +14 -delete
            fi

            # 重建并启动
            echo "===== 重建镜像 ====="
            docker compose build --no-cache

            echo "===== 重启服务 ====="
            docker compose up -d

            # 清理旧镜像
            echo "===== 清理旧镜像 ====="
            docker image prune -f

            # 健康检查
            echo "===== 健康检查 ====="
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -fsS $HEALTH_URL; then
                echo ""
                echo "部署完成：$(date)"
                exit 0
              fi
              echo "等待服务启动... ($i/5)"
              sleep 5
            done

            echo "健康检查失败，查看最近日志："
            docker compose logs --tail=100
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "部署失败，请检查 GitHub Actions 日志和服务器状态"
          echo "服务器登录命令：ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          echo "查看日志命令：ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd /root/new-api && docker compose logs --tail=200'"
